            cd $BUILD_SOURCES
            echo " - removing files that should not be packaged in the source tar"
            rm -rf ${BUILD_SOURCES}/.??*
            rm -rf ${BUILD_SOURCES}/doc*
            rm -rf ${BUILD_SOURCES}/*.md
            echo " - creating the source tar"
            cd $BUILD_ROOT
            ARTIFACTS_NAME=${PACKAGE_NAME}-${VERSION}
            mkdir -p ${ARTIFACTS_NAME}
            cp -r ${BUILD_SOURCES}/* ${ARTIFACTS_NAME}/.
            tar -cf ${ARTIFACTS_NAME}.tar ${ARTIFACTS_NAME}
            cp ${ARTIFACTS_NAME}.tar ${BUILD_SOURCES}/.
      -
        run:
          name: 'Building package'
          command: |-
            cd $BUILD_ROOT
            ./build
      -
        run:
          name: 'Upload RPMs to Pulp repository'
          command: |-
            echo "Uploading RPM packages to Pulp repository 'kazoo'"
            
            # Check if required environment variables are set
            if [ -z "$PULP_API_URL" ]; then
              echo "ERROR: PULP_API_URL environment variable is not set"
              exit 1
            fi
            if [ -z "$PULP_USERNAME" ]; then
              echo "ERROR: PULP_USERNAME environment variable is not set"
              exit 1
            fi
            if [ -z "$PULP_PASSWORD" ]; then
              echo "ERROR: PULP_PASSWORD environment variable is not set"
              exit 1
            fi
            
            echo "Using Pulp API URL: $PULP_API_URL"
            echo "Using Pulp Username: $PULP_USERNAME"
            
            # Ensure PULP_API_URL doesn't end with a slash
            PULP_API_URL_CLEAN=$(echo "$PULP_API_URL" | sed 's/\/$//')
            
            # Get the repository URL for 'kazoo'
            echo "Finding repository 'kazoo'..."
            REPO_RESPONSE=$(curl -s -u "${PULP_USERNAME}:${PULP_PASSWORD}" \
              "${PULP_API_URL_CLEAN}/repositories/rpm/rpm/?name=kazoo")
            
            REPO_URL=$(echo "$REPO_RESPONSE" | grep -o '"pulp_href":"[^"]*' | head -1 | cut -d'"' -f4)
            
            if [ -z "$REPO_URL" ]; then
              echo "ERROR: Could not find repository 'kazoo' or extract repository URL"
              echo "Repository response: $REPO_RESPONSE"
              exit 1
            fi
            
            echo "Found repository URL: $REPO_URL"
            FULL_REPO_URL="${PULP_API_URL_CLEAN}${REPO_URL}"
            echo "Full repository URL: $FULL_REPO_URL"
            
            # Upload each RPM
            for rpm in ${BUILD_RPMS}/*/*.rpm; do
              if [ -f "$rpm" ]; then
                echo "Uploading: $(basename $rpm)"
                
                # Step 1: Create content with repository specified
                upload_response=$(curl -w "%{http_code}" -s -u "${PULP_USERNAME}:${PULP_PASSWORD}" \
                  -X POST \
                  -F "file=@$rpm" \
                  -F "repository=${FULL_REPO_URL}" \
                  "${PULP_API_URL_CLEAN}/content/rpm/packages/")
                
                upload_http_code="${upload_response: -3}"
                upload_body="${upload_response%???}"
                
                if [ "$upload_http_code" -eq 200 ] || [ "$upload_http_code" -eq 201 ] || [ "$upload_http_code" -eq 202 ]; then
                  echo "Successfully uploaded $(basename $rpm) to repository (HTTP $upload_http_code)"
                else
                  echo "Failed to upload $(basename $rpm) - HTTP $upload_http_code"
                  echo "Response: $upload_body"
                fi
              fi
            done
            echo "RPM upload process completed"
      -
        store_artifacts:
          path: /home/circleci/2600hz/packager/RPMS